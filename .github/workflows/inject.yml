name: Inject Translations

on:
  workflow_dispatch:
    inputs:
      translation_file:
        description: 'Translation file name (csv/json)'
        required: false
        default: 'translated_content.csv'

jobs:
  inject:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run inject_translations.py
        run: |
          python inject_translations.py -t ${{ github.event.inputs.translation_file }}

      - name: Upload injected files
        uses: actions/upload-artifact@v4
        with:
          name: injected_files
          path: |
            **/*.cs
            **/*.xaml